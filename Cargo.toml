[package]
name = "codemap"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.33"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
ignore = "0.4"
regex = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-odin = "1"
tree-sitter-c = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
