[package]
name = "codemap"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
wgpu = "27"
fontdue = "0.9"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
ignore = "0.4"
regex = "1"
serde_json = "1"
png = "0.18"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-odin = "1"
tree-sitter-c = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_methods = "allow"
disallowed_types = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
field_reassign_with_default = "allow"

[workspace]
members = [".", "xtask", "crates/domain", "crates/io-store", "crates/ui", "crates/platform", "crates/features", "crates/io-process", "crates/io-vcs", "crates/io-map", "crates/io-source", "crates/io-cache", "crates/io-lsp", "crates/index", "crates/cli", "crates/codemap", "crates/gui"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
str_to_string = "deny"
iter_over_hash_type = "deny"
absolute_paths = "deny"
clone_on_ref_ptr = "deny"
get_unwrap = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
if_then_some_else_none = "deny"
shadow_unrelated = "deny"
min_ident_chars = "deny"
mod_module_files = "deny"
rc_buffer = "deny"
empty_structs_with_brackets = "deny"
tests_outside_test_module = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
